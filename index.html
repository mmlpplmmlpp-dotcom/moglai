<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>কাল কি তুমি আমাকে মোগলাই বানিয়ে দিবে? 💖</title>
<style>
  :root{
    --pink: #ff6fa5;
    --card-radius: 30px;
  }
  *, *::before, *::after{ box-sizing: border-box; }
  html{ overflow-x: hidden; }
  html, body{ margin:0; padding:0; }

  body{
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", "Noto Sans Bengali", sans-serif;
    background:
      radial-gradient(circle at 18% 18%, rgba(120, 40, 170, .55) 0%, transparent 55%),
      radial-gradient(circle at 82% 72%, rgba(190, 30, 100, .45) 0%, transparent 55%),
      radial-gradient(circle at 50% 110%, rgba(255, 90, 150, .25) 0%, transparent 60%),
      linear-gradient(160deg, #14061f 0%, #1d0730 45%, #0b0314 100%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .heart-float{
    position: fixed;
    bottom: -50px;
    left: 0;
    z-index: 1;
    pointer-events: none;
    will-change: transform, opacity;
    opacity: 0;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    filter: drop-shadow(0 0 6px rgba(255, 110, 165, .55));
  }
  @keyframes floatUp{
    0%   { transform: translateY(0) rotate(0deg) scale(.7); opacity: 0; }
    12%  { opacity: .85; }
    85%  { opacity: .45; }
    100% { transform: translateY(-115vh) rotate(380deg) scale(1.15); opacity: 0; }
  }

  .sound-toggle{
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 10000;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .25);
    background: rgba(255, 255, 255, .1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s ease, background .2s ease, opacity .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sound-toggle:active{ transform: scale(.9); }
  .sound-toggle.muted{ background: rgba(255, 255, 255, .04); opacity: .6; }

  .card{
    position: relative;
    z-index: 5;
    width: min(92vw, 400px);
    padding: 30px 24px 30px;
    border-radius: var(--card-radius);
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .16);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow:
      0 24px 70px rgba(0, 0, 0, .55),
      0 0 60px rgba(255, 90, 150, .18),
      inset 0 1px 0 rgba(255, 255, 255, .18);
    text-align: center;
    animation: cardIn .85s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes cardIn{
    from { opacity: 0; transform: translateY(26px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }

  .panel-out{
    opacity: 0;
    transform: scale(.9);
    transition: opacity .3s ease, transform .3s ease;
  }
  .panel-in{ animation: panelIn .55s cubic-bezier(.2, .9, .3, 1.25) both; }
  @keyframes panelIn{
    from { opacity: 0; transform: scale(.85) translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* ============ BEARS ============ */
  .bears{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
    position: relative;
    min-height: 100px;
    transition: transform .5s ease;
  }
  .bear{
    font-size: 54px;
    line-height: 1;
    display: inline-block;
    filter: drop-shadow(0 8px 14px rgba(255, 80, 140, .38));
    transform-origin: 50% 80%;
    will-change: transform;
  }
  img.bear{
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .75);
    background: #fff;
    box-shadow: 0 8px 22px rgba(255, 80, 140, .45);
    font-size: 0;
  }

  .bear-l{ animation: bobL 2.6s ease-in-out infinite; }
  .bear-r{ animation: bobR 2.6s ease-in-out infinite .35s; }
  @keyframes bobL{
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-9px) rotate(-9deg); }
  }
  @keyframes bobR{
    0%, 100% { transform: translateY(0) rotate(4deg); }
    50%      { transform: translateY(-9px) rotate(9deg); }
  }

  .bear-heart{
    font-size: 24px;
    align-self: center;
    animation: beat 1.1s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255, 90, 150, .8));
    transition: opacity .3s ease, transform .5s cubic-bezier(.34, 1.3, .5, 1);
    z-index: 3;
  }
  @keyframes beat{
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.38); }
  }

  /* ============================================================
     💋💕  ROMANTIC KISS ANIMATION
  ============================================================ */
  .bears.kissing{
    animation: kissSway 2.6s ease-in-out infinite;
  }
  @keyframes kissSway{
    0%, 100% { transform: rotate(-2.5deg) translateY(0); }
    50%      { transform: rotate(2.5deg) translateY(-5px); }
  }

  .bears.kissing .bear-heart{
    opacity: 0;
    transform: scale(0);
    animation: none;
  }

  .bears.kissing .bear-l{
    animation:
      leanInL .75s cubic-bezier(.34, 1.4, .5, 1) forwards,
      kissBobL .95s ease-in-out .75s infinite;
  }
  .bears.kissing .bear-r{
    animation:
      leanInR .75s cubic-bezier(.34, 1.4, .5, 1) forwards,
      kissBobR .95s ease-in-out .75s infinite;
  }

  @keyframes leanInL{
    0%   { transform: translateX(0) rotate(-6deg) scale(1); }
    55%  { transform: translateX(56px) rotate(16deg) scale(1.12); }
    75%  { transform: translateX(46px) rotate(10deg) scale(1.08); }
    100% { transform: translateX(50px) rotate(13deg) scale(1.1); }
  }
  @keyframes leanInR{
    0%   { transform: translateX(0) rotate(6deg) scale(1); }
    55%  { transform: translateX(-56px) rotate(-16deg) scale(1.12); }
    75%  { transform: translateX(-46px) rotate(-10deg) scale(1.08); }
    100% { transform: translateX(-50px) rotate(-13deg) scale(1.1); }
  }

  @keyframes kissBobL{
    0%, 100% { transform: translateX(50px) rotate(13deg) scale(1.1); }
    30%      { transform: translateX(52px) rotate(15deg) scale(1.11); }
    60%      { transform: translateX(49px) rotate(11deg) scale(1.09); }
  }
  @keyframes kissBobR{
    0%, 100% { transform: translateX(-50px) rotate(-13deg) scale(1.1); }
    30%      { transform: translateX(-52px) rotate(-15deg) scale(1.11); }
    60%      { transform: translateX(-49px) rotate(-11deg) scale(1.09); }
  }

  .bears.kissing::before{
    content: "";
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%) scale(.7);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 120, 180, .9) 0%,
      rgba(255, 90, 150, .5) 35%,
      rgba(255, 90, 150, 0) 72%);
    filter: blur(6px);
    animation: kissGlow 1.4s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes kissGlow{
    0%, 100% { transform: translate(-50%, -50%) scale(.75); opacity: .65; }
    50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  .bears.kissing::after{
    content: "💋";
    position: absolute;
    left: 50%;
    top: 8%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 40px;
    z-index: 10;
    filter: drop-shadow(0 0 16px rgba(255, 60, 120, 1));
    animation:
      kissPop .6s cubic-bezier(.34, 1.56, .64, 1) .55s forwards,
      kissPulse 1.05s ease-in-out 1.15s infinite;
    pointer-events: none;
  }
  @keyframes kissPop{
    0%   { transform: translate(-50%, -50%) scale(0) rotate(-35deg); opacity: 0; }
    55%  { transform: translate(-50%, -50%) scale(1.55) rotate(10deg); opacity: 1; }
    80%  { transform: translate(-50%, -50%) scale(.9) rotate(-4deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); opacity: 1; }
  }
  @keyframes kissPulse{
    0%, 100% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); }
    50%      { transform: translate(-50%, -50%) scale(1.28) rotate(-6deg); }
  }

  .kiss-heart{
    position: absolute;
    font-size: 22px;
    pointer-events: none;
    z-index: 11;
    animation: kissFloatUp 2.2s cubic-bezier(.2, .7, .3, 1) forwards;
    filter: drop-shadow(0 0 10px rgba(255, 100, 160, .95));
  }
  @keyframes kissFloatUp{
    0%   { transform: translate(-50%, 0) scale(.2) rotate(0deg); opacity: 0; }
    15%  { opacity: 1; transform: translate(-50%, -14px) scale(1.05) rotate(6deg); }
    60%  { opacity: 1; }
    100% {
      transform: translate(calc(-50% + var(--dx, 0px)), -130px)
                 scale(1.2) rotate(var(--rot, 25deg));
      opacity: 0;
    }
  }

  /* ============ TEXT ============ */
  h1{
    margin: 0 0 10px;
    font-size: clamp(1.3rem, 5.4vw, 1.7rem);
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: .2px;
    background: linear-gradient(95deg, #ffd1e6, #ff8ab8 40%, #ffd9a8 70%, #ffd1e6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(255, 110, 165, .35));
  }
  .sub{
    margin: 0;
    font-size: clamp(.85rem, 3.6vw, .95rem);
    line-height: 1.65;
    color: rgba(255, 232, 243, .78);
    font-weight: 500;
  }

  /* ============ BUTTONS ============ */
  .btn-row{
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 24px;
    min-height: 62px;
  }
  .btn{
    font-family: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: .3px;
    padding: 13px 26px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transform-origin: center center;
    will-change: transform;
  }

  .no-btn{
    color: #fff;
    background: linear-gradient(135deg, #6d4c8f, #472c63);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .18);
    transition:
      transform .38s cubic-bezier(.34, 1.56, .64, 1),
      background .45s ease,
      box-shadow .45s ease,
      opacity .4s ease;
    z-index: 9999;
  }
  .no-btn.stage-1{
    transform: scale(1.18);
    background: linear-gradient(135deg, #a8385c, #742040);
    box-shadow: 0 12px 30px rgba(180, 40, 80, .5), inset 0 1px 0 rgba(255, 255, 255, .2);
  }
  .no-btn.stage-2{
    transform: scale(1.45);
    background: linear-gradient(135deg, #e01e37, #960d20);
    box-shadow: 0 14px 38px rgba(224, 30, 55, .65), 0 0 26px rgba(255, 60, 80, .45),
                inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .no-btn.blasting{
    transform: scale(1.75);
    opacity: 0;
    transition: transform .42s ease, opacity .42s ease;
  }

  .no-inner{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    will-change: transform;
  }
  .no-emoji{
    display: inline-block;
    font-size: 1.2em;
    line-height: 1;
    transition: font-size .38s cubic-bezier(.34, 1.56, .64, 1), transform .3s ease;
  }
  .no-btn.stage-1 .no-emoji{ font-size: 1.85em; }
  .no-btn.stage-2 .no-emoji{ font-size: 2.4em; }

  .shake-soft{ animation: shakeSoft .45s ease; }
  .shake-hard{ animation: shakeHard .55s ease; }
  @keyframes shakeSoft{
    0%, 100% { transform: translateX(0) rotate(0); }
    20%      { transform: translateX(-5px) rotate(-3deg); }
    40%      { transform: translateX(5px) rotate(3deg); }
    60%      { transform: translateX(-3px) rotate(-2deg); }
    80%      { transform: translateX(3px) rotate(2deg); }
  }
  @keyframes shakeHard{
    0%, 100% { transform: translateX(0) rotate(0) scale(1); }
    10%      { transform: translateX(-9px) rotate(-7deg) scale(1.04); }
    25%      { transform: translateX(9px) rotate(7deg) scale(1.05); }
    40%      { transform: translateX(-8px) rotate(-6deg) scale(1.04); }
    55%      { transform: translateX(8px) rotate(6deg) scale(1.05); }
    70%      { transform: translateX(-5px) rotate(-4deg) scale(1.02); }
    85%      { transform: translateX(5px) rotate(4deg) scale(1.02); }
  }

  /* --- YES BUTTON --- */
  .yes-btn{
    display: none;
    color: #4a0d24;
    background: linear-gradient(135deg, #ffe3f0 0%, #ff9ec7 45%, #ff6fa5 100%);
    box-shadow: 0 0 20px rgba(255, 110, 165, .6), 0 10px 26px rgba(255, 80, 140, .35);
    transition:
      left .3s cubic-bezier(.34, 1.56, .64, 1),
      top .3s cubic-bezier(.34, 1.56, .64, 1),
      transform .3s cubic-bezier(.34, 1.56, .64, 1),
      box-shadow .3s ease,
      filter .2s ease;
    z-index: 9999;
  }
  .yes-btn:active{ filter: brightness(1.12); }
  .yes-btn.dodge-flash{
    box-shadow: 0 0 40px rgba(255, 110, 165, 1), 0 12px 32px rgba(255, 80, 140, .7);
    transform: scale(1.12) rotate(6deg);
  }
  .yes-btn.ready{
    animation:
      yesPop .65s cubic-bezier(.34, 1.56, .64, 1) both,
      yesGlow 1.7s ease-in-out .65s infinite;
  }
  @keyframes yesPop{
    0%   { transform: scale(0) rotate(-25deg); opacity: 0; }
    60%  { transform: scale(1.18) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes yesGlow{
    0%, 100%{
      box-shadow: 0 0 18px rgba(255, 110, 165, .55), 0 10px 24px rgba(255, 80, 140, .35);
    }
    50%{
      box-shadow: 0 0 38px rgba(255, 110, 165, 1), 0 12px 32px rgba(255, 80, 140, .55);
    }
  }

  /* ============ FX LAYER ============ */
  .particle{
    position: fixed;
    left: 0;
    top: 0;
    z-index: 999;
    pointer-events: none;
    line-height: 1;
    will-change: transform, opacity;
    animation-name: fly;
    animation-timing-function: cubic-bezier(.15, .75, .3, 1);
    animation-fill-mode: forwards;
  }
  @keyframes fly{
    0%{
      transform: translate(-50%, -50%) translate(0, 0) scale(.25) rotate(0deg);
      opacity: 1;
    }
    65%{ opacity: 1; }
    100%{
      transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(var(--sc)) rotate(var(--rot));
      opacity: 0;
    }
  }

  .shockwave{
    position: fixed;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 6px solid rgba(255, 190, 120, .95);
    box-shadow: 0 0 30px rgba(255, 140, 60, .8), inset 0 0 20px rgba(255, 200, 120, .6);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 998;
    animation: shock .65s ease-out forwards;
  }
  @keyframes shock{
    0%   { width: 20px;  height: 20px;  opacity: 1; border-width: 7px; }
    100% { width: 360px; height: 360px; opacity: 0; border-width: 1px; }
  }

  .flash{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 900;
    background: radial-gradient(circle at 50% 50%,
      rgba(255, 255, 255, .95) 0%,
      rgba(255, 160, 90, .55) 28%,
      rgba(255, 60, 90, .25) 50%,
      transparent 72%);
    opacity: 0;
    animation: flashAnim .85s ease-out forwards;
  }
  @keyframes flashAnim{
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    100% { opacity: 0; }
  }

  @media (max-width: 360px){
    .bear{ font-size: 46px; }
    img.bear{ width: 60px; height: 60px; }
    .btn{ font-size: .98rem; padding: 12px 22px; }
  }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" type="button" aria-label="Sound on/off">🔊</button>

<main class="card" id="card">

  <section class="panel" id="panelAsk">
    <div class="bears" id="bearsAsk">
      <img class="bear bear-l" src="boy.jpg" alt="🐻"
           onerror="this.outerHTML='<span class=\'bear bear-l\'>🐻</span>';">
      <span class="bear-heart">💗</span>
      <img class="bear bear-r" src="girl.jpg" alt="🧸"
           onerror="this.outerHTML='<span class=\'bear bear-r\'>🧸</span>';">
    </div>

    <h1>কাল কি তুমি আমাকে মোগলাই বানিয়ে দিবে? 💖</h1>
    <p class="sub">please… চা-ও বানিয়ে দিও 🍵</p>

    <div class="btn-row" id="btnRow">
      <button class="btn no-btn" id="noBtn" type="button">
        <span class="no-inner" id="noInner">
          <span class="no-emoji" id="noEmoji">😡</span>
          <span>No</span>
        </span>
      </button>

      <button class="btn yes-btn" id="yesBtn" type="button" style="display: none;">
        Yes! 💖
      </button>
    </div>
  </section>

  <section class="panel" id="panelYes" hidden>
    <div class="bears happy" id="bearsYes">
      <img class="bear bear-l" src="boy.jpg" alt="🐻"
           onerror="this.outerHTML='<span class=\'bear bear-l\'>🐻</span>';">
      <span class="bear-heart">💞</span>
      <img class="bear bear-r" src="girl.jpg" alt="🧸"
           onerror="this.outerHTML='<span class=\'bear bear-r\'>🧸</span>';">
    </div>

    <h1>আমি জানতাম! 🥰</h1>
    <p class="sub">তাহলে সিগারেটও খাইয়ো 🚬😌</p>
  </section>

</main>

<script>
(function () {
  "use strict";

  var panelAsk = document.getElementById("panelAsk");
  var panelYes = document.getElementById("panelYes");
  var noBtn    = document.getElementById("noBtn");
  var noInner  = document.getElementById("noInner");
  var yesBtn   = document.getElementById("yesBtn");
  var bearsYes = document.getElementById("bearsYes");

  /* =========================================================
     SOUND ENGINE
  ========================================================= */
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  var soundOn = true;
  var bgMusicNodes = null;

  function ensureAudio() {
    if (!AudioCtx) return null;
    if (!actx) actx = new AudioCtx();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }

  function playBoing(pitch) {
    if (!soundOn) return;
    var ctx = ensureAudio(); if (!ctx) return;
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    var base = pitch || 420;
    osc.frequency.setValueAtTime(base, t);
    osc.frequency.exponentialRampToValueAtTime(base * 0.35, t + 0.22);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.3);
  }

  function playSwoosh() {
    if (!soundOn) return;
    var ctx = ensureAudio(); if (!ctx) return;
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(900, t);
    osc.frequency.exponentialRampToValueAtTime(260, t + 0.18);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.24);
  }

  function playBlast() {
    if (!soundOn) return;
    var ctx = ensureAudio(); if (!ctx) return;
    var t = ctx.currentTime;
    var dur = 1.1;
    var bufferSize = ctx.sampleRate * dur;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    var noise = ctx.createBufferSource(); noise.buffer = buffer;
    var noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "lowpass";
    noiseFilter.frequency.setValueAtTime(2400, t);
    noiseFilter.frequency.exponentialRampToValueAtTime(180, t + dur);
    var noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.55, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
    noise.start(t); noise.stop(t + dur);

    var boom = ctx.createOscillator();
    boom.type = "sine";
    boom.frequency.setValueAtTime(120, t);
    boom.frequency.exponentialRampToValueAtTime(35, t + 0.7);
    var boomGain = ctx.createGain();
    boomGain.gain.setValueAtTime(0.0001, t);
    boomGain.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
    boomGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    boom.connect(boomGain).connect(ctx.destination);
    boom.start(t); boom.stop(t + 0.95);
  }

  function playYesChime() {
    if (!soundOn) return;
    var ctx = ensureAudio(); if (!ctx) return;
    var t = ctx.currentTime;
    var notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach(function (freq, i) {
      var start = t + i * 0.09;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.9);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start); osc.stop(start + 1.0);
    });
  }

  function playKissSound() {
    if (!soundOn) return;
    var ctx = ensureAudio(); if (!ctx) return;
    var t = ctx.currentTime;

    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(920, t);
    osc.frequency.exponentialRampToValueAtTime(300, t + 0.13);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.32, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.27);

    var osc2 = ctx.createOscillator();
    var g2 = ctx.createGain();
    osc2.type = "triangle";
    osc2.frequency.setValueAtTime(1200, t + 0.08);
    osc2.frequency.exponentialRampToValueAtTime(1900, t + 0.28);
    g2.gain.setValueAtTime(0.0001, t + 0.08);
    g2.gain.exponentialRampToValueAtTime(0.14, t + 0.1);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    osc2.connect(g2).connect(ctx.destination);
    osc2.start(t + 0.08); osc2.stop(t + 0.36);
  }

  /* =========================================================
     VOICE
  ========================================================= */
  var voicesLoaded = [];
  var voiceReady = false;
  var MALE_VOICE_NAMES = [
    "microsoft david", "microsoft mark", "microsoft george", "microsoft james",
    "microsoft guy", "microsoft eric", "microsoft ryan",
    "alex", "daniel", "fred", "tom", "oliver", "aaron", "arthur",
    "rishi", "gordon", "lee",
    "google uk english male", "google us english male",
    "english (male)", "en-us-x-iom-local", "en-gb-x-gbb-local",
    "samsung english male", "samsung uk english male"
  ];

  function loadVoices() {
    if (!("speechSynthesis" in window)) return;
    voicesLoaded = window.speechSynthesis.getVoices() || [];
    voiceReady = voicesLoaded.length > 0;
  }
  if ("speechSynthesis" in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    var tryCount = 0;
    var tryTimer = window.setInterval(function () {
      loadVoices(); tryCount++;
      if (voiceReady || tryCount > 20) window.clearInterval(tryTimer);
    }, 250);
  }

  function pickMaleVoice() {
    if (!voicesLoaded.length) return null;
    for (var i = 0; i < MALE_VOICE_NAMES.length; i++) {
      var needle = MALE_VOICE_NAMES[i];
      var found = voicesLoaded.find(function (v) {
        return v.name && v.name.toLowerCase().indexOf(needle) !== -1;
      });
      if (found) return found;
    }
    var maleByName = voicesLoaded.find(function (v) {
      return v.name && /male(?!\s*female)/i.test(v.name) && /^en/i.test(v.lang);
    });
    if (maleByName) return maleByName;
    var anyEn = voicesLoaded.find(function (v) { return /en[-_]US/i.test(v.lang); });
    if (anyEn) return anyEn;
    return voicesLoaded.find(function (v) { return /^en/i.test(v.lang); }) || null;
  }

  function buildUtterance() {
    var utter = new SpeechSynthesisUtterance("I love you infinity");
    utter.rate = 0.82;
    utter.pitch = 0.65;
    utter.volume = 1.0;
    utter.lang = "en-US";
    var v = pickMaleVoice();
    if (v) { utter.voice = v; if (v.lang) utter.lang = v.lang; }
    return utter;
  }

  function speakLoveInfinity() {
    if (!soundOn) return;
    if (!("speechSynthesis" in window)) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    loadVoices();
    var utter = buildUtterance();
    window.setTimeout(function () {
      if (!soundOn) return;
      if (!window.speechSynthesis.speaking) {
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(buildUtterance());
        } catch (e) {}
      }
    }, 260);
    try { window.speechSynthesis.speak(utter); } catch (err) {}
  }

  /* Background music */
  function startBgMusic() {
    if (!soundOn || bgMusicNodes) return;
    var ctx = ensureAudio(); if (!ctx) return;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 2);
    master.connect(ctx.destination);

    var chords = [
      [220.00, 261.63, 329.63],
      [174.61, 220.00, 261.63],
      [261.63, 329.63, 392.00],
      [196.00, 246.94, 293.66]
    ];
    var idx = 0;
    function playChord() {
      if (!soundOn) return;
      var now = ctx.currentTime;
      var freqs = chords[idx % chords.length];
      freqs.forEach(function (f) {
        var osc = ctx.createOscillator();
        var g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.08, now + 0.8);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 3.2);
        osc.connect(g).connect(master);
        osc.start(now); osc.stop(now + 3.4);
      });
      idx++;
    }
    playChord();
    var loopId = window.setInterval(playChord, 3000);
    bgMusicNodes = { master: master, loopId: loopId };
  }

  function stopBgMusic() {
    if (!bgMusicNodes) return;
    window.clearInterval(bgMusicNodes.loopId);
    try {
      if (actx) bgMusicNodes.master.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.4);
    } catch (e) {}
    var master = bgMusicNodes.master;
    window.setTimeout(function () {
      try { master.disconnect(); } catch (e) {}
    }, 500);
    bgMusicNodes = null;
  }

  var soundToggle = document.getElementById("soundToggle");
  soundToggle.addEventListener("click", function (e) {
    e.stopPropagation();
    soundOn = !soundOn;
    if (soundOn) {
      soundToggle.textContent = "🔊";
      soundToggle.classList.remove("muted");
      ensureAudio(); startBgMusic();
    } else {
      soundToggle.textContent = "🔇";
      soundToggle.classList.add("muted");
      stopBgMusic();
      try { window.speechSynthesis.cancel(); } catch (err) {}
    }
  });

  function initAudioOnce() {
    ensureAudio();
    if (soundOn) startBgMusic();
    if ("speechSynthesis" in window) loadVoices();
    document.removeEventListener("click", initAudioOnce);
    document.removeEventListener("touchstart", initAudioOnce);
  }
  document.addEventListener("click", initAudioOnce);
  document.addEventListener("touchstart", initAudioOnce);

  /* =========================================================
     BACKGROUND HEARTS
  ========================================================= */
  var BG_HEARTS = ["💖", "💗", "💕", "❤️", "💓", "💞", "🌸", "✨"];
  function spawnBgHeart() {
    var el = document.createElement("span");
    el.className = "heart-float";
    el.textContent = BG_HEARTS[(Math.random() * BG_HEARTS.length) | 0];
    el.style.left = (Math.random() * 100).toFixed(2) + "vw";
    el.style.fontSize = (12 + Math.random() * 20).toFixed(1) + "px";
    var dur = 8 + Math.random() * 7;
    el.style.animationDuration = dur.toFixed(2) + "s";
    el.style.animationDelay = (Math.random() * 1.6).toFixed(2) + "s";
    document.body.appendChild(el);
    window.setTimeout(function () { el.remove(); }, (dur + 4) * 1000);
  }
  for (var i = 0; i < 12; i++) window.setTimeout(spawnBgHeart, i * 380);
  window.setInterval(spawnBgHeart, 850);

  /* =========================================================
     PARTICLE ENGINE
  ========================================================= */
  function spawnParticles(cx, cy, count, cfg) {
    for (var i = 0; i < count; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      var angle = Math.random() * Math.PI * 2;
      var dist  = cfg.minDist + Math.random() * (cfg.maxDist - cfg.minDist);
      var tx    = Math.cos(angle) * dist;
      var ty    = Math.sin(angle) * dist + (cfg.gravity || 0);
      var size  = cfg.minSize + Math.random() * (cfg.maxSize - cfg.minSize);
      var dur   = cfg.minDur + Math.random() * (cfg.maxDur - cfg.minDur);
      var useEmoji = Math.random() < cfg.emojiRatio;

      if (useEmoji) {
        p.textContent = cfg.emojis[(Math.random() * cfg.emojis.length) | 0];
        p.style.fontSize = size.toFixed(1) + "px";
        p.style.filter = "drop-shadow(0 0 9px " + cfg.glow + ")";
      } else {
        p.style.width  = size.toFixed(1) + "px";
        p.style.height = size.toFixed(1) + "px";
        p.style.background = cfg.colors[(Math.random() * cfg.colors.length) | 0];
        p.style.borderRadius = Math.random() < 0.5 ? "50%" : "3px";
        p.style.boxShadow = "0 0 12px " + cfg.glow;
      }
      p.style.left = cx + "px";
      p.style.top  = cy + "px";
      p.style.setProperty("--tx",  tx.toFixed(1) + "px");
      p.style.setProperty("--ty",  ty.toFixed(1) + "px");
      p.style.setProperty("--sc",  (0.6 + Math.random() * 0.9).toFixed(2));
      p.style.setProperty("--rot", ((Math.random() * 720) - 360).toFixed(0) + "deg");
      document.body.appendChild(p);
      (function (node, life) {
        window.setTimeout(function () { node.remove(); }, life);
      })(p, dur * 1000 + 150);
    }
  }

  var BLAST_EMOJIS = ["💥", "🔥", "💢", "✨", "💫", "⭐", "❤️‍🔥", "💣"];
  var BLAST_COLORS = ["#ff3b30", "#ff9500", "#ffd60a", "#ff2d55", "#ffffff", "#ff6b00", "#ff4d6d"];

  function doBlast(cx, cy) {
    var flash = document.createElement("div");
    flash.className = "flash";
    document.body.appendChild(flash);
    window.setTimeout(function () { flash.remove(); }, 900);

    var ring = document.createElement("div");
    ring.className = "shockwave";
    ring.style.left = cx + "px";
    ring.style.top  = cy + "px";
    document.body.appendChild(ring);
    window.setTimeout(function () { ring.remove(); }, 720);

    spawnParticles(cx, cy, 36, {
      emojis: BLAST_EMOJIS, colors: BLAST_COLORS, emojiRatio: 0.65,
      glow: "rgba(255, 140, 60, .85)",
      minDist: 60, maxDist: 270, minSize: 14, maxSize: 40,
      minDur: 0.6, maxDur: 1.35, gravity: 80
    });
    window.setTimeout(function () {
      spawnParticles(cx, cy, 24, {
        emojis: BLAST_EMOJIS, colors: BLAST_COLORS, emojiRatio: 0.55,
        glow: "rgba(255, 90, 60, .85)",
        minDist: 40, maxDist: 200, minSize: 10, maxSize: 30,
        minDur: 0.55, maxDur: 1.1, gravity: 100
      });
    }, 120);
  }

  var LOVE_EMOJIS = ["💖", "💗", "💕", "❤️", "💓", "💞", "💝", "😍"];
  function heartExplosion() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    var reach = Math.max(window.innerWidth, window.innerHeight) * 0.72;
    spawnParticles(cx, cy, 55, {
      emojis: LOVE_EMOJIS,
      colors: ["#ff6fa5", "#ffd1e6", "#ffffff", "#ff2d55"],
      emojiRatio: 1,
      glow: "rgba(255, 110, 165, .9)",
      minDist: 70, maxDist: reach, minSize: 18, maxSize: 52,
      minDur: 1.1, maxDur: 2.3, gravity: 120
    });
  }

  /* =========================================================
     NO BUTTON LOGIC
  ========================================================= */
  var clickCount = 0;
  var locked = false;
  function shake(el, cls) {
    el.classList.remove("shake-soft", "shake-hard");
    void el.offsetWidth;
    el.classList.add(cls);
  }
  noInner.addEventListener("animationend", function () {
    noInner.classList.remove("shake-soft", "shake-hard");
  });

  function moveNoButton() {
    if (noBtn.parentNode !== document.body) document.body.appendChild(noBtn);
    noBtn.style.position = "fixed";
    noBtn.style.margin = "0";
    noBtn.style.right = "auto";
    noBtn.style.bottom = "auto";
    var btnW = noBtn.offsetWidth, btnH = noBtn.offsetHeight;
    var maxX = window.innerWidth - btnW - 12;
    var maxY = window.innerHeight - btnH - 12;
    if (maxX < 12) maxX = 12;
    if (maxY < 12) maxY = 12;
    noBtn.style.left = Math.max(12, Math.min(Math.random() * maxX, maxX)) + "px";
    noBtn.style.top  = Math.max(12, Math.min(Math.random() * maxY, maxY)) + "px";
  }

  noBtn.addEventListener("click", function () {
    if (locked) return;
    clickCount++;
    if (clickCount === 1) {
      playBoing(500);
      noBtn.classList.add("stage-1");
      shake(noInner, "shake-soft");
      moveNoButton();
      return;
    }
    if (clickCount === 2) {
      playBoing(360);
      noBtn.classList.remove("stage-1");
      noBtn.classList.add("stage-2");
      shake(noInner, "shake-hard");
      moveNoButton();
      return;
    }
    locked = true;
    playBlast();
    var rect = noBtn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    doBlast(cx, cy);
    window.setTimeout(function () { noBtn.classList.add("blasting"); }, 120);
    window.setTimeout(function () {
      noBtn.style.display = "none";
      yesBtn.style.display = "inline-flex";
      startYesDodge();
    }, 520);
  });

  /* =========================================================
     YES BUTTON — ঠিক ৬ বার পালাবে
  ========================================================= */
  var YES_DODGE_TOTAL = 6;
  var yesDodgesDone   = 0;
  var yesReadyToClick = false;
  var dodgeLock       = false;

  function moveYesButton() {
    if (yesBtn.parentNode !== document.body) document.body.appendChild(yesBtn);
    yesBtn.style.position = "fixed";
    yesBtn.style.margin = "0";
    yesBtn.style.right = "auto";
    yesBtn.style.bottom = "auto";
    var btnW = yesBtn.offsetWidth, btnH = yesBtn.offsetHeight;
    var maxX = window.innerWidth - btnW - 16;
    var maxY = window.innerHeight - btnH - 16;
    if (maxX < 16) maxX = 16;
    if (maxY < 16) maxY = 16;
    yesBtn.style.left = Math.max(16, Math.min(Math.random() * maxX, maxX)) + "px";
    yesBtn.style.top  = Math.max(16, Math.min(Math.random() * maxY, maxY)) + "px";
  }

  function startYesDodge() {
    yesDodgesDone = 0;
    yesReadyToClick = false;
    dodgeLock = false;
    yesBtn.classList.remove("ready");
    moveYesButton();
  }

  function tryDodge() {
    if (yesReadyToClick) return false;
    if (dodgeLock) return false;
    if (yesDodgesDone >= YES_DODGE_TOTAL) {
      yesReadyToClick = true;
      yesBtn.classList.add("ready");
      return false;
    }
    dodgeLock = true;
    playSwoosh();
    yesBtn.classList.add("dodge-flash");
    moveYesButton();
    yesDodgesDone++;
    window.setTimeout(function () { yesBtn.classList.remove("dodge-flash"); }, 300);
    window.setTimeout(function () { dodgeLock = false; }, 350);
    if (yesDodgesDone >= YES_DODGE_TOTAL) {
      yesReadyToClick = true;
      window.setTimeout(function () { yesBtn.classList.add("ready"); }, 380);
    }
    return true;
  }

  document.addEventListener("mousemove", function (e) {
    if (yesReadyToClick) return;
    if (yesBtn.style.display === "none") return;
    var r = yesBtn.getBoundingClientRect();
    if (r.width === 0) return;
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var dx = e.clientX - cx;
    var dy = e.clientY - cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var safety = Math.max(r.width, r.height) * 0.9 + 20;
    if (dist < safety) tryDodge();
  });

  yesBtn.addEventListener("touchstart", function (e) {
    if (yesReadyToClick) return;
    if (tryDodge()) { e.preventDefault(); e.stopPropagation(); }
  }, { passive: false });
  yesBtn.addEventListener("mousedown", function (e) {
    if (yesReadyToClick) return;
    if (tryDodge()) { e.preventDefault(); e.stopPropagation(); }
  });
  yesBtn.addEventListener("mouseenter", function () {
    if (yesReadyToClick) return;
    tryDodge();
  });

  /* =========================================================
     💋 KISS — উন্নত অ্যানিমেশন
  ========================================================= */
  var kissHeartTimer = null;

  function startKissHearts() {
    if (kissHeartTimer) return;
    var heartSet = ["💖", "💕", "💗", "💞", "💋", "❤️", "💓", "💝"];
    kissHeartTimer = window.setInterval(function () {
      if (!bearsYes) return;
      var h = document.createElement("span");
      h.className = "kiss-heart";
      h.textContent = heartSet[(Math.random() * heartSet.length) | 0];

      var leftPct  = 35 + Math.random() * 30;
      var topPct   = 20 + Math.random() * 30;
      h.style.left = leftPct + "%";
      h.style.top  = topPct + "%";
      h.style.fontSize = (14 + Math.random() * 18).toFixed(0) + "px";
      h.style.setProperty("--dx",  ((Math.random() * 140) - 70).toFixed(0) + "px");
      h.style.setProperty("--rot", ((Math.random() * 60) - 30).toFixed(0) + "deg");

      bearsYes.appendChild(h);
      window.setTimeout(function () { h.remove(); }, 2300);
    }, 220);
  }

  function stopKissHearts() {
    if (kissHeartTimer) {
      window.clearInterval(kissHeartTimer);
      kissHeartTimer = null;
    }
  }

  function bearsKiss() {
    if (!bearsYes) return;
    bearsYes.classList.add("kissing");

    window.setTimeout(playKissSound, 550);
    window.setTimeout(startKissHearts, 400);
    window.setTimeout(playKissSound, 1500);
    window.setTimeout(playKissSound, 2400);
    window.setTimeout(stopKissHearts, 7000);
  }

  yesBtn.addEventListener("click", function (e) {
    if (yesBtn.disabled) return;
    if (!yesReadyToClick) {
      e.preventDefault();
      e.stopPropagation();
      tryDodge();
      return;
    }
    yesBtn.disabled = true;
    yesBtn.classList.remove("ready");

    playYesChime();
    speakLoveInfinity();

    heartExplosion();
    window.setTimeout(heartExplosion, 280);
    window.setTimeout(heartExplosion, 620);

    panelAsk.classList.add("panel-out");

    window.setTimeout(function () {
      panelAsk.hidden = true;
      panelAsk.classList.remove("panel-out");
      panelYes.hidden = false;
      panelYes.classList.add("panel-in");

      window.setTimeout(bearsKiss, 350);
    }, 300);
  });

})();
</script>
</body>
